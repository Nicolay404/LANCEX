[project]
name = "lancex-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "architecture: reglas de arquitectura verificadas automáticamente (fitness functions)",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "DJ", "BLE", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # textos en español
    "RUF012",  # atributos de clase de DRF (permission_classes...)
    "N818",    # errores con nombre semántico (Conflict, NotFound) como en el contrato
    "DJ001",   # los modelos reflejan el SQL: columnas de texto NULL existen (managed = False)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"conftest.py" = ["S101"]
"config/settings/*" = ["F405"]
