# Inventario de endpoints por rol (SEGURIDAD-Y-AUTORIZACION.md §5, QA-09).
#
# Toda ruta del URLConf debe tener una fila aquí con el código esperado para cada actor.
# Actores: visitor, user, buyer_member, supplier_member, moderator, admin.
# La prueba completa por rol es LX-18 (SEC/BD); test_endpoint_inventory.py ya exige que
# ninguna ruta quede fuera de este archivo.

endpoints:
  - route: /api/v1/schema/
    methods:
      GET: {visitor: 200, user: 200, buyer_member: 200, supplier_member: 200, moderator: 200, admin: 200}
    notes: Solo existe con LANCEX_SERVE_SCHEMA=true (local/pruebas). Enumera rutas de staff; no exponer en una demo pública.

  - route: /api/v1/auth/csrf/
    methods:
      GET: {visitor: 204, user: 204, buyer_member: 204, supplier_member: 204, moderator: 204, admin: 204}

  - route: /api/v1/auth/register/
    methods:
      POST: {visitor: 201, user: 201, buyer_member: 201, supplier_member: 201, moderator: 201, admin: 201}
    notes: Público. Con email nuevo y CSRF; 409 EMAIL_ALREADY_REGISTERED si existe.

  - route: /api/v1/auth/login/
    methods:
      POST: {visitor: 200, user: 200, buyer_member: 200, supplier_member: 200, moderator: 200, admin: 200}
    notes: Público. Con las credenciales del propio actor; 401 INVALID_CREDENTIALS genérico.

  - route: /api/v1/auth/logout/
    methods:
      POST: {visitor: 401, user: 204, buyer_member: 204, supplier_member: 204, moderator: 204, admin: 204}

  - route: /api/v1/auth/me/
    methods:
      GET: {visitor: 401, user: 200, buyer_member: 200, supplier_member: 200, moderator: 200, admin: 200}
      PATCH: {visitor: 401, user: 200, buyer_member: 200, supplier_member: 200, moderator: 200, admin: 200}
    notes: PATCH solo acepta display_name; otro campo -> 400 UNKNOWN_FIELD.

  - route: /api/v1/auth/password/
    methods:
      POST: {visitor: 401, user: 204, buyer_member: 204, supplier_member: 204, moderator: 204, admin: 204}
    notes: "Step-up. Contraseña actual incorrecta -> 403 STEP_UP_FAILED."

  - route: /api/v1/categories/
    methods:
      GET: {visitor: 200, user: 200, buyer_member: 200, supplier_member: 200, moderator: 200, admin: 200}

  - route: /api/v1/listings/
    methods:
      POST: {visitor: 401, user: 201, buyer_member: 201, supplier_member: 201, moderator: 403, admin: 403}
    notes: "Staff no vende. Máximo 50 por usuario -> 409 LIMIT_REACHED."

  - route: /api/v1/listings/{listing_id}/
    methods:
      GET: {visitor: 401, user: 404, buyer_member: 404, supplier_member: 404, moderator: 403, admin: 403}
      PATCH: {visitor: 401, user: 404, buyer_member: 404, supplier_member: 404, moderator: 403, admin: 403}
    notes: "Con una publicación ajena. El dueño recibe 200; con subasta abierta, PATCH -> 409 LISTING_LOCKED."

  - route: /api/v1/auctions/
    methods:
      GET: {visitor: 200, user: 200, buyer_member: 200, supplier_member: 200, moderator: 200, admin: 200}
      POST: {visitor: 401, user: 201, buyer_member: 201, supplier_member: 201, moderator: 403, admin: 403}
    notes: "POST con publicación propia; staff no vende. mine=owner|participating|watching exige sesión."

  - route: /api/v1/auctions/{auction_id}/
    methods:
      GET: {visitor: 200, user: 200, buyer_member: 200, supplier_member: 200, moderator: 200, admin: 200}
      PATCH: {visitor: 401, user: 403, buyer_member: 403, supplier_member: 403, moderator: 403, admin: 403}
    notes: "GET de subasta publicada. Borrador ajeno -> 404. PATCH de subasta ajena -> 403 (visible) o 404 (borrador); dueño -> 200."

  - route: /api/v1/auctions/{auction_id}/publish/
    methods:
      POST: {visitor: 401, user: 403, buyer_member: 403, supplier_member: 403, moderator: 403, admin: 403}
    notes: "Con subasta ajena publicada. Dueño en draft -> 200."

  - route: /api/v1/auctions/{auction_id}/cancel/
    methods:
      POST: {visitor: 401, user: 403, buyer_member: 403, supplier_member: 403, moderator: 403, admin: 403}
    notes: "Con subasta ajena. Moderación usa /moderation/auctions/{id}/cancel/ (LX-77)."

  - route: /api/v1/auctions/{auction_id}/live/
    methods:
      GET: {visitor: 200, user: 200, buyer_member: 200, supplier_member: 200, moderator: 200, admin: 200}
    notes: "304 con If-None-Match igual al ETag."

  - route: /api/v1/auctions/{auction_id}/bids/
    methods:
      GET: {visitor: 200, user: 200, buyer_member: 200, supplier_member: 200, moderator: 200, admin: 200}
      POST: {visitor: 401, user: 201, buyer_member: 201, supplier_member: 201, moderator: 403, admin: 403}
    notes: "POST en subasta activa ajena con Idempotency-Key; reintento -> 200; dueño -> 403 BID_ON_OWN_AUCTION."

  - route: /api/v1/auctions/{auction_id}/result/
    methods:
      GET: {visitor: 200, user: 200, buyer_member: 200, supplier_member: 200, moderator: 200, admin: 200}
    notes: "Materializa el cierre si está pendiente."

  - route: /api/v1/auctions/{auction_id}/proxy-limit/
    methods:
      GET: {visitor: 401, user: 200, buyer_member: 200, supplier_member: 200, moderator: 403, admin: 403}
      PUT: {visitor: 401, user: 200, buyer_member: 200, supplier_member: 200, moderator: 403, admin: 403}
    notes: "Solo el máximo propio. PUT en subasta activa ajena con proxy_enabled; sin proxy -> 409 PROXY_NOT_ENABLED."

  - route: /api/v1/auctions/{auction_id}/watch/
    methods:
      PUT: {visitor: 401, user: 204, buyer_member: 204, supplier_member: 204, moderator: 403, admin: 403}
      DELETE: {visitor: 401, user: 204, buyer_member: 204, supplier_member: 204, moderator: 403, admin: 403}
    notes: "Idempotente. Borrador ajeno -> 404."

  - route: /api/v1/notifications/
    methods:
      GET: {visitor: 401, user: 200, buyer_member: 200, supplier_member: 200, moderator: 200, admin: 200}
    notes: "Solo las propias."

  - route: /api/v1/notifications/read/
    methods:
      POST: {visitor: 401, user: 200, buyer_member: 200, supplier_member: 200, moderator: 200, admin: 200}
    notes: "ids ajenos se ignoran."

  - route: /api/v1/reports/
    methods:
      POST: {visitor: 401, user: 201, buyer_member: 201, supplier_member: 201, moderator: 403, admin: 403}
    notes: "10 por día (LIMIT_REACHED) y uno por objeto (ALREADY_REPORTED)."

  - route: /api/v1/auctions/{auction_id}/sealed-offer/
    methods:
      GET: {visitor: 401, user: 200, buyer_member: 200, supplier_member: 200, moderator: 403, admin: 403}
      PUT: {visitor: 401, user: 201, buyer_member: 201, supplier_member: 201, moderator: 403, admin: 403}
      DELETE: {visitor: 401, user: 404, buyer_member: 404, supplier_member: 404, moderator: 403, admin: 403}
    notes: "Solo la oferta propia. PUT con Idempotency-Key en sellada activa ajena (reintento 200); DELETE sin oferta vigente -> 404, con oferta -> 204."

  - route: /api/v1/organizations/
    methods:
      POST: {visitor: 401, user: 201, buyer_member: 201, supplier_member: 201, moderator: 403, admin: 403}
    notes: "Crea en pending; el creador es owner. RUC duplicado -> 409 RUC_ALREADY_REGISTERED."

  - route: /api/v1/organizations/{organization_id}/
    methods:
      GET: {visitor: 401, user: 403, buyer_member: 404, supplier_member: 404, moderator: 403, admin: 403}
      PATCH: {visitor: 401, user: 403, buyer_member: 404, supplier_member: 404, moderator: 403, admin: 403}
    notes: "Con organización AJENA: miembro de otra -> 404; sin organizaciones -> 403. Miembro propio GET 200; PATCH solo owner."

  - route: /api/v1/organizations/{organization_id}/members/
    methods:
      POST: {visitor: 401, user: 403, buyer_member: 404, supplier_member: 404, moderator: 403, admin: 403}
    notes: "Solo owner de esa organización."

  - route: /api/v1/organizations/{organization_id}/members/{user_id}/
    methods:
      DELETE: {visitor: 401, user: 403, buyer_member: 404, supplier_member: 404, moderator: 403, admin: 403}
    notes: "LAST_OWNER si aplica."

  - route: /api/v1/organizations/{organization_id}/transfer-ownership/
    methods:
      POST: {visitor: 401, user: 403, buyer_member: 404, supplier_member: 404, moderator: 403, admin: 403}
    notes: "Step-up con contraseña."

  - route: /api/v1/moderation/organizations/
    methods:
      GET: {visitor: 401, user: 403, buyer_member: 403, supplier_member: 403, moderator: 200, admin: 200}
    notes: "Bandeja."

  - route: /api/v1/moderation/organizations/{organization_id}/decision/
    methods:
      POST: {visitor: 401, user: 403, buyer_member: 403, supplier_member: 403, moderator: 200, admin: 200}
    notes: "verified|rejected con nota."

  - route: /api/v1/procurement-requests/
    methods:
      POST: {visitor: 401, user: 403, buyer_member: 201, supplier_member: 403, moderator: 403, admin: 403}
    notes: "organization_id de una compradora verificada propia."

  - route: /api/v1/procurement-requests/{request_id}/
    methods:
      GET: {visitor: 200, user: 200, buyer_member: 200, supplier_member: 200, moderator: 200, admin: 200}
    notes: "Público."

  - route: /api/v1/auctions/{auction_id}/participants/
    methods:
      GET: {visitor: 401, user: 403, buyer_member: 200, supplier_member: 200, moderator: 403, admin: 403}
      POST: {visitor: 401, user: 403, buyer_member: 403, supplier_member: 201, moderator: 403, admin: 403}
    notes: "GET: compradora todas, proveedor las suyas. POST antes de starts_at; CONFLICT_OF_INTEREST si aplica."

  - route: /api/v1/auctions/{auction_id}/participants/{participant_id}/decision/
    methods:
      POST: {visitor: 401, user: 403, buyer_member: 200, supplier_member: 403, moderator: 403, admin: 403}
    notes: "Miembro de la compradora de ESA subasta, antes de starts_at."

  - route: /api/v1/auctions/{auction_id}/candle-proof/
    methods:
      GET: {visitor: 200, user: 200, buyer_member: 200, supplier_member: 200, moderator: 200, admin: 200}
    notes: "Subasta de vela cerrada. Antes del cierre -> 409 NOT_REVEALED_YET; otra modalidad -> 409 MECHANISM_MISMATCH."

  - route: /api/v1/listings/{listing_id}/images/upload-url/
    methods:
      POST: {visitor: 401, user: 404, buyer_member: 404, supplier_member: 404, moderator: 403, admin: 403}
    notes: "Con publicación ajena -> 404; dueño -> 200 con URL firmada; tipo/tamaño inválidos -> 400."

  - route: /api/v1/listings/{listing_id}/images/
    methods:
      POST: {visitor: 401, user: 404, buyer_member: 404, supplier_member: 404, moderator: 403, admin: 403}
    notes: "Valida metadatos reales en Storage. Dueño -> 201."

  - route: /api/v1/listings/{listing_id}/images/{image_id}/
    methods:
      DELETE: {visitor: 401, user: 404, buyer_member: 404, supplier_member: 404, moderator: 403, admin: 403}
    notes: "Solo sin subasta abierta (LISTING_LOCKED)."

  - route: /api/v1/auctions/{auction_id}/settlement/
    methods:
      PATCH: {visitor: 401, user: 403, buyer_member: 403, supplier_member: 403, moderator: 403, admin: 403}
    notes: "Con subasta ajena. Dueño (o compradora) de una adjudicada en pending -> 200."

  - route: /api/v1/auctions/{auction_id}/rating/
    methods:
      POST: {visitor: 401, user: 403, buyer_member: 403, supplier_member: 403, moderator: 403, admin: 403}
    notes: "Con subasta ajena cerrada. Dueño o ganador con liquidación final -> 201; segunda vez -> 409 ALREADY_RATED."

  - route: /api/v1/users/{user_id}/
    methods:
      GET: {visitor: 200, user: 200, buyer_member: 200, supplier_member: 200, moderator: 200, admin: 200}
    notes: "Público, sin email."
