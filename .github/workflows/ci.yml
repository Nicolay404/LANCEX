# CI de LANCEX (LX-09). Corre en cada PR a main y en push a main.
# - Backend: ruff + check + pytest contra un PostgreSQL de servicio con los SQL de supabase/migrations.
# - Frontend: lint + tsc + vitest + build (se activa solo cuando exista frontend/package.json, LX-07).
# - E2E (solo push a main): Playwright contra backend real + PostgreSQL de servicio (LX-74).
# Nunca se conecta a Supabase ni a Firebase.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # Misma versión mayor que el proyecto Supabase (ajustar si el dashboard indica otra).
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lancex_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      TEST_DATABASE_URL: postgres://lancex_app:lancex_app@localhost:54329/lancex_test  # rol sin DDL, como en Supabase
      FIRESTORE_LOGS_ENABLED: "false"
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Aplicar esquema SQL al PostgreSQL de servicio
        working-directory: .
        env:
          PSQL: psql -h localhost -p 54329 -U postgres
        run: |
          bash ./scripts/db/apply_local.sh
          if ls supabase/migrations/*.sql >/dev/null 2>&1; then
            echo "LANCEX_REQUIRE_DB=1" >> "$GITHUB_ENV"   # con esquema, las pruebas de BD no pueden omitirse
          else
            echo "::warning::Sin supabase/migrations: las pruebas de BD se omiten."
          fi

      - name: System checks (incluye lancex.E001..E004)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
          DJANGO_SECRET_KEY: ci-only-not-secret
          DATABASE_URL: postgres://postgres:postgres@localhost:54329/lancex_test
        run: python manage.py check

      - name: Pytest
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: ¿Existe el frontend?
        id: detect
        working-directory: .
        run: echo "present=$([ -f frontend/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar, lint, tipos, pruebas y build
        if: steps.detect.outputs.present == 'true'
        run: |
          npm ci
          npm run lint
          npx tsc --noEmit
          npm test -- --run
          npm run build

      - name: Frontend pendiente
        if: steps.detect.outputs.present != 'true'
        working-directory: .
        run: echo "::notice::frontend/package.json no existe todavía (LX-07); job omitido."

  # E2E Playwright de las 4 modalidades contra el backend real (LX-74, propuesta de Frontend).
  # Solo en push a main: cada recorrido espera cierres reales (~6 min). Sin secretos ni Supabase.
  e2e:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lancex_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: ci-only-not-secret
      DATABASE_URL: postgres://lancex_app:lancex_app@localhost:54329/lancex_test  # rol sin DDL
      DB_SSLMODE: disable
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost:5173
      FIRESTORE_LOGS_ENABLED: "false"
      DEV_NAME: ci
      LANCEX_DEMO_PASSWORD: Ci-Demo-${{ github.run_id }}!  # cuentas demo efímeras del contenedor
      E2E_DEMO_PASSWORD: Ci-Demo-${{ github.run_id }}!
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar backend
        run: python -m pip install -r backend/requirements.txt

      - name: Aplicar esquema SQL al PostgreSQL de servicio
        env:
          PSQL: psql -h localhost -p 54329 -U postgres
        run: bash ./scripts/db/apply_local.sh

      - name: Backend en segundo plano (seed, servidor y cierre de subastas)
        working-directory: backend
        run: |
          python manage.py seed_demo
          nohup python manage.py runserver 8000 > ../django.log 2>&1 &
          nohup python manage.py close_due_auctions --loop 5 > ../closer.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/api/v1/categories/ > /dev/null && exit 0
            sleep 2
          done
          echo "::error::El backend no respondió en 60 s"; cat ../django.log; exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: E2E
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e

      - name: Reporte de E2E (solo si falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            frontend/playwright-report
            frontend/test-results
            django.log
            closer.log
