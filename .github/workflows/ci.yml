# CI de LANCEX (LX-09). Corre en cada PR a main y en push a main.
# - Backend: ruff + check + pytest contra un PostgreSQL de servicio con los SQL de supabase/migrations.
# - Frontend: lint + tsc + vitest + build (se activa solo cuando exista frontend/package.json, LX-07).
# Nunca se conecta a Supabase ni a Firebase.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # Misma versión mayor que el proyecto Supabase (ajustar si el dashboard indica otra).
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lancex_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:54329/lancex_test
      FIRESTORE_LOGS_ENABLED: "false"
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Aplicar esquema SQL al PostgreSQL de servicio
        working-directory: .
        run: |
          shopt -s nullglob
          PSQL="psql -h localhost -p 54329 -U postgres -d lancex_test -v ON_ERROR_STOP=1 -q"
          if [ -f scripts/db/bootstrap_local.sql ]; then $PSQL -f scripts/db/bootstrap_local.sql; fi
          files=(supabase/migrations/*.sql)
          for f in "${files[@]}"; do echo "Aplicando $f"; $PSQL -f "$f"; done
          if [ ${#files[@]} -gt 0 ]; then
            echo "LANCEX_REQUIRE_DB=1" >> "$GITHUB_ENV"   # con esquema, las pruebas de BD no pueden omitirse
          else
            echo "::warning::Sin supabase/migrations (LX-02 pendiente): las pruebas de BD se omiten."
          fi

      - name: System checks (incluye lancex.E001..E004)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
          DJANGO_SECRET_KEY: ci-only-not-secret
          DATABASE_URL: postgres://postgres:postgres@localhost:54329/lancex_test
        run: python manage.py check

      - name: Pytest
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: ¿Existe el frontend?
        id: detect
        working-directory: .
        run: echo "present=$([ -f frontend/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar, lint, tipos, pruebas y build
        if: steps.detect.outputs.present == 'true'
        run: |
          npm ci
          npm run lint
          npx tsc --noEmit
          npm test -- --run
          npm run build

      - name: Frontend pendiente
        if: steps.detect.outputs.present != 'true'
        working-directory: .
        run: echo "::notice::frontend/package.json no existe todavía (LX-07); job omitido."
